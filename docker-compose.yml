# Compose profiles keep RAM under control on a 15 GB laptop (see docs/environment.md §6).
#   core          : api + postgres + redis + qdrant             (~1.5 GB)
#   inference     : vllm (GPU)                                   (Phase 6)
#   observability : prometheus + grafana + otel-collector + jaeger (Phase 22)
#   edge          : kong                                         (Phase 16)
#   eval          : mlflow                                       (Phase 13)
#   scale         : api replicas + workers                       (Phase 18/20)
#   load          : locust                                       (Phase 30)
#
# Never `--profile "*"`. Typical: docker compose --profile core up -d

name: llmops

x-api-env: &api-env
  LLMOPS_APP__ENV: ${LLMOPS_APP__ENV:-local}
  LLMOPS_APP__LOG_LEVEL: ${LLMOPS_APP__LOG_LEVEL:-INFO}
  LLMOPS_APP__LOG_FORMAT: json
  LLMOPS_LLM__PROVIDER: ${LLMOPS_LLM__PROVIDER:-mock}
  LLMOPS_LLM__MODEL: ${LLMOPS_LLM__MODEL:-mock-1}
  LLMOPS_POSTGRES__HOST: postgres
  LLMOPS_POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-llmops}
  LLMOPS_REDIS__URL: redis://redis:6379/0
  LLMOPS_QDRANT__URL: http://qdrant:6333

services:
  api:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/llm-application/Dockerfile
    image: llmops/llm-application:${IMAGE_TAG:-dev}
    environment:
      <<: *api-env
    # Phase 1–15: published directly. Phase 16: Kong takes 8080, this port mapping is removed.
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }
    restart: unless-stopped

  postgres:
    profiles: [core]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmops}
      POSTGRES_DB: llmops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmops -d llmops"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M }

  redis:
    profiles: [core]
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 320M }

  qdrant:
    profiles: [core]
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # qdrant image has no curl/wget; bash TCP probe against the HTTP port
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 768M }

volumes:
  postgres-data:
  qdrant-data:
