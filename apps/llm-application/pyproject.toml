[project]
name = "llm-application"
version = "0.1.0"
description = "Application service: /chat, /rag, /agent entrypoints (stateless replica)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llmops-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[tool.uv.sources]
llmops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_application"]
