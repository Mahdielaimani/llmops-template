[project]
name = "classical-ml"
version = "0.1.0"
description = "Classical ML serving, for contrast with LLM serving (Phase 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llmops-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "joblib>=1.4",
]

[tool.uv.sources]
llmops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classical_ml"]
