[project]
name = "rag-service"
version = "0.1.0"
description = "Retrieval service: ingestion pipeline and ACL-filtered hybrid retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llmops-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    # fastembed is ONNX-based: ~130 MB with weights, against ~1 GB for
    # sentence-transformers + torch. Disk is the binding constraint (ADR-020).
    "fastembed>=0.4",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
]

[tool.uv.sources]
llmops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]
