[project]
name = "llmops-registry"
version = "0.1.0"
description = "Versioned prompt, model and retrieval-config registries with stage pointers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llmops-core",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[tool.uv.sources]
llmops-core = { workspace = true }

[project.scripts]
llmops-registry = "llmops_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmops_registry"]
