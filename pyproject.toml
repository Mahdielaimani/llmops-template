[project]
name = "llmops-platform"
version = "0.1.0"
description = "Enterprise Financial Document Assistant — LLMOps / AI platform laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llmops-core",
    "llm-application",
    "classical-ml",
    "rag-service",
    "llmops-registry",
    "llmops-eval",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "poethepoet>=0.30",
    "httpx2>=2.13.0",
    # Phase 4 inference experiments: real GPT-2 tokenizer, no torch.
    # Mechanics are implemented in numpy so every matmul is visible; torch and real
    # weights arrive in Phase 6 with the GPU, where the disk budget belongs.
    "tokenizers>=0.20",
    "types-pyyaml>=6.0.12.20260906",
]

# ---------------------------------------------------------------------------
# uv workspace: one lockfile, one venv, many packages.
# Each app/service/package has its own pyproject.toml and can be built into
# its own Docker image, but they share pinned dependency versions.
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
    "services/*",
]

[tool.uv.sources]
llmops-core = { workspace = true }
llm-application = { workspace = true }
classical-ml = { workspace = true }
rag-service = { workspace = true }
llmops-registry = { workspace = true }
llmops-eval = { workspace = true }

# ---------------------------------------------------------------------------
# Task runner (replaces Makefile on Windows; Makefile delegates here).
# Usage: uv run poe <task>
# ---------------------------------------------------------------------------
[tool.poe.tasks]
_ruff_check = "ruff check ."
_ruff_fmt_check = "ruff format --check ."
lint = ["_ruff_check", "_ruff_fmt_check"]
fmt = ["_ruff_fmt", "_ruff_fix"]
_ruff_fmt = "ruff format ."
_ruff_fix = "ruff check --fix ."
typecheck = "mypy packages apps"
registry = "llmops-registry verify"
test = "pytest"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration -m integration"
cov = "pytest --cov --cov-report=term-missing"
check = ["lint", "typecheck", "registry", "test-unit"]

dev = "uvicorn llm_application.main:app --host 0.0.0.0 --port 8080 --reload"

up = "docker compose --profile core up -d --build"
down = "docker compose --profile core down"
logs = "docker compose logs -f --tail=100"
ps = "docker compose ps"

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
extend-exclude = ["docs", "*.md"]
target-version = "py312"
src = ["packages/*/src", "apps/*/src", "services/*/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "T20",      # no print
    "SIM",      # simplify
    "RUF",
]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
# CLI entrypoints: printing results is the interface, not a debug leftover.
"scripts/**" = ["T20"]
"benchmarks/**" = ["T20"]
"**/train.py" = ["T20"]
# Corpus/fixture generators: prints are the CLI, and `random` is a seeded fixture
# generator rather than a security primitive.
"**/corpus.py" = ["T20", "S311"]
"**/ingest.py" = ["T20"]
"**/evalset.py" = ["T20"]
"**/cli.py" = ["T20"]
# Teaching scripts: the printed output IS the deliverable, and they import a
# sibling module after a sys.path insert, which E402 cannot express.
"inference/experiments/**" = ["T20", "E402", "ANN001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/llmops-core/src:packages/llmops-registry/src:apps/llm-application/src:apps/classical-ml/src:apps/rag-service/src:packages/llmops-eval/src"
namespace_packages = true
explicit_package_bases = true

# sklearn, scipy and joblib ship no py.typed marker. Scoped to those modules so the
# rest of the codebase keeps strict checking.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "joblib.*", "fastembed.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "integration: needs running docker compose services",
    "gpu: needs NVIDIA GPU",
]
filterwarnings = ["error::DeprecationWarning:llmops_core", "error::DeprecationWarning:llm_application"]

[tool.coverage.run]
source = ["llmops_core", "llm_application"]
branch = true
